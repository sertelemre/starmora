server {
 listen 80;
 server_name _;
 server_tokens off;
 # TLS terminates at Dokploy's Traefik; keep redirects on the incoming scheme.
 absolute_redirect off;
 # Re-resolve backend after a Compose recreation changes its container IP.
 resolver 127.0.0.11 valid=10s ipv6=off;
 include /etc/nginx/starmora-upstream.conf;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 include /etc/nginx/starmora-csp.conf;
 gzip on;
 gzip_vary on;
 gzip_min_length 1024;
 gzip_types text/css application/javascript application/json application/xml image/svg+xml;
 location = / { return 301 /tr/; }
 location = /privacy.html { return 301 /tr/gizlilik/; }
 location = /terms.html { return 301 /tr/kullanim-kosullari/; }
 location = /tr/harita/ { add_header X-Robots-Tag "noindex, nofollow" always; include /etc/nginx/starmora-csp.conf; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; add_header Cache-Control "no-store" always; try_files $uri/index.html =404; }
 location = /en/chart/ { add_header X-Robots-Tag "noindex, nofollow" always; include /etc/nginx/starmora-csp.conf; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; add_header Cache-Control "no-store" always; try_files $uri/index.html =404; }
 location /api/ {
  access_log off;
  proxy_pass $api_upstream;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Referrer-Policy;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_read_timeout 35s;
 }
 location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(js|css|woff2)$" { expires 1y; try_files $uri =404; }
 location /en/ { error_page 404 /404-en.html; try_files $uri $uri/ =404; }
 location / { error_page 404 /404.html; try_files $uri $uri/ =404; }
 location = /404.html { internal; }
 location = /404-en.html { internal; }
}
