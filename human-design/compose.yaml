services:
 db:
  image: postgres:17-alpine
  environment:
   POSTGRES_USER: ${POSTGRES_USER:-starmora}
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
   POSTGRES_DB: ${POSTGRES_DB:-starmora_hd}
  volumes: [postgres_data:/var/lib/postgresql/data]
  healthcheck:
   test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
   interval: 5s
   timeout: 5s
   retries: 12
 backend:
  build: ./backend
  environment:
   ADDR: 0.0.0.0:8080
   DATABASE_URL: postgres://${POSTGRES_USER:-starmora}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-starmora_hd}?sslmode=disable
   BODYGRAPH_API_KEY: ${BODYGRAPH_API_KEY:-}
   CALCULATION_PROVIDER: ${CALCULATION_PROVIDER:-local}
   COOKIE_SECURE: ${COOKIE_SECURE:-false}
   TRUST_PROXY: 'true'
  depends_on:
   db: {condition: service_healthy}
 frontend:
  build:
   context: .
   dockerfile: frontend/Dockerfile
  ports: ['127.0.0.1:${WEB_PORT:-5173}:80']
  depends_on: [backend]
volumes:
 postgres_data:
